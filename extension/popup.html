<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="./icons/icon32.png">
  <title>RoadRush LAN</title>
</head>
<body>
  <main class="popup">
    <header>
      <div class="mark">RR</div>
      <div>
        <h1>ROAD<span>RUSH</span></h1>
        <p>LAN ARCADE RACING</p>
      </div>
    </header>

    <button id="quick-race" class="primary" type="button">QUICK RACE</button>
    <button id="open-game" class="secondary" type="button">GAME MENU</button>
    <button id="open-launcher" class="secondary" type="button">LAUNCHER &amp; LAN</button>

    <div class="meta">
      <div><span>RIDER</span><strong id="rider">Rider</strong></div>
      <div><span>LOCAL BEST</span><strong id="best">--:--.---</strong></div>
    </div>
    <p class="hint">Single player works offline immediately. LAN needs the host's included server.</p>
  </main>
  <script type="module" src="./popup.js"></script>
</body>
</html>
